server {
    listen 80;
    server_name api.papsasinc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.papsasinc.com;

    # Certbot-managed certs (adjust if using different path)
    ssl_certificate     /etc/letsencrypt/live/api.papsasinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.papsasinc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 10M;

    # Serve Django static and media directly via Nginx
    # Must match Django STATIC_URL and STATIC_ROOT
    location /static/ {
        alias /srv/papsas/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /srv/papsas/app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }
}

